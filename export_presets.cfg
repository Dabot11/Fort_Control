; Export data is public. Set your own application identifiers and signing locally.
; JSON filters are required because gameplay reads these files through FileAccess.

[preset.0]
name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,docs/*,scripts/run_tests.sh,README.md,AGENTS.md"
export_path="build/macos/FortControl.zip"
script_export_mode=2

[preset.0.options]
binary_format/architecture="universal"
application/bundle_identifier=""
application/short_version="0.1.0"
application/version="1"

