name: Probar y publicar Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      XDG_CONFIG_HOME: /tmp/fort-control-godot/config
      XDG_CACHE_HOME: /tmp/fort-control-godot/cache
      XDG_DATA_HOME: /tmp/fort-control-godot/data
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reutilizar motor y plantilla Web
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/fort-godot-4.6.3
          key: fort-godot-4.6.3-linux-x86_64-${{ hashFiles('scripts/ci/setup_godot.sh') }}
      - name: Instalar Godot y plantilla Web verificados
        run: bash scripts/ci/setup_godot.sh
      - name: Verificar juego y tres partidas completas
        run: bash scripts/run_tests.sh --gameplay
      - name: Exportar Web sin modificar ajustes nativos
        run: bash scripts/export_web.sh
      - name: Guardar sitio para Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar enlace de prueba
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
